<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>smartEGO AI · Account</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="auth-card"><p class="eyebrow">BUILDLAB AI</p><h1>Welcome to your workspace</h1><p>Register an account or sign in. Your saved projects and chat history are private to your account.</p><div class="auth-tabs"><button id="show-login" type="button">Login</button><button id="show-register" type="button">Create account</button></div><form id="auth-form"><label for="auth-email">Email</label><input id="auth-email" type="email" autocomplete="email" maxlength="254" required><label for="auth-password">Password</label><input id="auth-password" type="password" autocomplete="current-password" minlength="10" maxlength="200" required><p class="safe-note">Use at least 10 characters. Keep your password private.</p><button class="primary" id="auth-submit" type="submit">Login</button><p id="auth-status" role="status"></p></form></main><script>
let mode='login';const form=document.querySelector('#auth-form'),status=document.querySelector('#auth-status'),pass=document.querySelector('#auth-password'),submit=document.querySelector('#auth-submit');
function setMode(m){mode=m;submit.textContent=m==='login'?'Login':'Create account';pass.autocomplete=m==='login'?'current-password':'new-password';document.querySelector('#show-login').classList.toggle('active',m==='login');document.querySelector('#show-register').classList.toggle('active',m==='register');}
document.querySelector('#show-login').onclick=()=>setMode('login');document.querySelector('#show-register').onclick=()=>setMode('register');
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Please wait…';submit.disabled=true;try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#auth-email').value,password:pass.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Authentication failed');location.href='/';}catch(err){status.textContent=err.message;}finally{submit.disabled=false;}});
</script></body></html>
